<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ghostsweeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra+SC&family=Almendra:ital,wght@0,400;0,700;1,400&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: a single haunted floor plan. Header with the ghost counter, a grid of rooms (6x6, then 8x8, then 9x9) with a candlelit frame,
   and a small control row below. Warm candle amber on cold slate-violet; ghosts are the only white thing on the page. */
:root{
  --ink:#0c0a12; --wall:#1b1626; --wall2:#241d32; --door:#33293f; --open:#0f0c16; --edge:#463a58;
  --bone:#ece6d4; --dim:#a597b8; --candle:#ffb347; --pumpkin:#ff7a1a; --ghost:#f2f7f4; --bad:#ff5d4a;
  --display:'Almendra SC',Georgia,'Times New Roman',serif;
  --text:'Almendra',Georgia,'Times New Roman',serif;
  --mono:'Share Tech Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --cols:8;
  --c:clamp(30px,min(calc((100vw - 80px) / var(--cols)),calc(69vh / var(--cols))),60px);
  --g:clamp(3px,.9vw,5px);
  color-scheme:dark;
}
html{height:100%;background:var(--ink)}
body{
  min-height:100%;margin:0;padding-inline:16px;padding-block:18px 14px;
  display:flex;flex-direction:column;gap:12px;
  background:var(--ink) radial-gradient(ellipse 70% 45% at 50% 38%,rgba(255,179,71,.12) 0%,rgba(255,179,71,0) 100%);
  color:var(--bone);font-family:var(--text);
  touch-action:manipulation;
}
.head{text-align:center;display:grid;gap:.4rem;justify-items:center}
h1{margin:0;font:400 clamp(1.9rem,6.4vw,2.9rem)/1.05 var(--display);letter-spacing:.03em;text-wrap:balance;text-shadow:0 0 22px rgba(255,179,71,.35)}
.count{display:flex;align-items:center;gap:.55rem;font:clamp(1.3rem,4.6vw,1.7rem)/1 var(--mono);color:var(--candle);font-variant-numeric:tabular-nums}
.count svg{width:1.6em;height:1.6em;display:block}
.house{margin:0;font:italic 1.05rem/1.2 var(--text);color:var(--dim)}

.stage{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:clamp(.8rem,2.4vh,1.3rem)}
.frame{
  padding:clamp(8px,2vw,14px);border-radius:18px;border:1px solid var(--edge);
  background:linear-gradient(180deg,#201a2c,#14101c);
  box-shadow:0 0 40px rgba(255,150,40,.10),inset 0 0 0 1px rgba(255,255,255,.03);
}
.board{display:grid;grid-template-columns:repeat(var(--cols),var(--c));gap:var(--g)}
.board.fade{transition:opacity .5s;opacity:0}

.cell{
  appearance:none;padding:0;margin:0;width:var(--c);height:var(--c);border-radius:8px;
  display:grid;place-items:center;cursor:pointer;color:var(--bone);
  border:1px solid #4a3d5e;background:linear-gradient(160deg,var(--wall2),var(--wall));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 0 #08060d;
  font:700 clamp(1.05rem,4.4vw,1.6rem)/1 var(--mono);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  transition:background .15s,border-color .15s;
}
.cell:hover:not(.open){border-color:var(--candle)}
.cell:focus-visible{outline:2px solid var(--pumpkin);outline-offset:2px;z-index:1}
.cell svg{width:76%;height:76%;display:block;pointer-events:none}
.cell.open{background:var(--open);border-color:#241d30;box-shadow:none;cursor:default}
.cell.flag{background:linear-gradient(160deg,#3b2a2f,#2a1f26);border-color:#8a5a3a}
.cell.boom{background:#3a1218;border-color:var(--bad);animation:boom .5s ease}
.cell.ghost svg{filter:drop-shadow(0 0 6px rgba(242,247,244,.7))}
.cell.wrong{background:#2a1a1a;border-color:#7a3a2a}
@keyframes boom{0%{transform:scale(1)}30%{transform:scale(1.25)}100%{transform:scale(1)}}
.n1{color:#7fd4ff}.n2{color:#7dff9a}.n3{color:#ff9a7d}.n4{color:#d79bff}
.n5{color:#ffd84a}.n6{color:#5ef0e0}.n7{color:#fff}.n8{color:#c9c2d8}

.msg{display:grid;justify-items:center;gap:.6rem;text-align:center;min-height:5.6rem;align-content:start}
.msg-t{margin:0;font:400 clamp(1.5rem,5.4vw,2rem)/1.1 var(--display);text-wrap:balance}
.msg-t.win{color:var(--candle);text-shadow:0 0 18px rgba(255,179,71,.6)}
.msg-t.lose{color:var(--bad);text-shadow:0 0 18px rgba(255,93,74,.5)}

.cell.pop{animation:ghostin .7s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:var(--d,0s)}
.frame{position:relative}
.walkers{position:absolute;inset:0;pointer-events:none;z-index:2}
.walker,.candy,.crumb{position:absolute;left:0;top:0;will-change:transform}
.walker .bob{display:block;width:100%;height:100%;animation:float .45s ease-in-out infinite alternate}
.walker svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 6px rgba(242,247,244,.7))}
.walker.munch svg{animation:munch .22s ease-out}
@keyframes float{from{transform:translateY(-7%) rotate(-7deg)}to{transform:translateY(7%) rotate(7deg)}}
@keyframes munch{0%{transform:scale(1)}40%{transform:scale(1.25,.8)}100%{transform:scale(1)}}
.cell.eaten{animation:eaten .3s ease-in forwards}
@keyframes eaten{0%{transform:scale(1)}50%{transform:scale(.82)}100%{transform:scale(1);color:transparent}}
.candy svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));animation:candybob 2.6s ease-in-out infinite;animation-delay:var(--cd,0s)}
@keyframes candybob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9%) rotate(4deg)}}
.crumb{border-radius:50%}
.cell.dance svg{animation:dance .9s ease-in-out infinite;animation-delay:var(--dd,0s);transform-origin:50% 85%}
@keyframes dance{
  0%,100%{transform:translateY(0) rotate(0) scale(1,1)}
  20%{transform:translateY(0) rotate(-12deg) scale(1.08,.9)}
  45%{transform:translateY(-22%) rotate(0) scale(.94,1.08)}
  70%{transform:translateY(0) rotate(12deg) scale(1.08,.9)}
  85%{transform:translateY(-10%) rotate(4deg) scale(1,1.03)}
}
@keyframes ghostin{
  0%{transform:scale(.2) rotate(-25deg);opacity:0;background:#3b2a2f}
  60%{transform:scale(1.28) rotate(6deg);opacity:1}
  100%{transform:scale(1) rotate(0);opacity:1}
}

[hidden]{display:none!important}
.final{display:grid;justify-items:center;gap:.3rem}
.final.on{animation:rise .8s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg-sub{margin:0;font-size:1.05rem;font-style:italic;color:var(--dim)}
.coord{margin:0;font:clamp(1.5rem,6.8vw,2.7rem)/1.15 var(--mono);letter-spacing:.04em;overflow-wrap:anywhere}
.coord-n{color:#8dff88;text-shadow:0 0 6px #62f06a,0 0 18px rgba(98,240,106,.75),0 0 40px rgba(98,240,106,.4)}
.coord-w{color:#ffab55;text-shadow:0 0 6px #ff7a1a,0 0 18px rgba(255,122,26,.75),0 0 40px rgba(255,122,26,.4)}
.final.on .coord{animation:flick 1.3s linear both,glow 3.4s 1.3s ease-in-out infinite}
.final.on .coord-w{animation-delay:.25s,1.9s}
@keyframes flick{0%{opacity:0}8%{opacity:1}12%{opacity:.15}18%{opacity:1}30%{opacity:.4}36%{opacity:1}100%{opacity:1}}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}

.ctl{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;font-family:var(--mono);font-size:.85rem}
.btn{font:inherit;color:var(--dim);background:rgba(12,10,18,.7);border:1px solid var(--edge);border-radius:6px;padding:.55rem .85rem;cursor:pointer}
.btn:hover{color:var(--bone);border-color:var(--candle)}
.btn:focus-visible{outline:2px solid var(--pumpkin);outline-offset:2px}
.btn[aria-pressed="true"]{color:var(--candle);border-color:var(--candle)}
.btn.primary{font:700 1.05rem/1 var(--text);letter-spacing:.04em;color:#1a0b00;background:var(--candle);border-color:var(--candle);padding:.65rem 1.5rem}
.btn.primary:hover{background:#ffc470;color:#1a0b00}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.scare{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.scare .dark{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(5,2,10,.35),rgba(0,0,0,.92));opacity:0}
.flyer{position:absolute;left:0;top:0;transform-origin:50% 50%;filter:drop-shadow(0 0 14px rgba(160,255,190,.55)) drop-shadow(0 0 4px rgba(255,60,40,.5));will-change:transform}
.cell.morph svg{animation:morph 1s ease-in both}
@keyframes morph{0%{transform:scale(1);filter:none}50%{transform:scale(1.35) rotate(-8deg);filter:drop-shadow(0 0 10px #ff3a2a)}100%{transform:scale(1.5);opacity:0}}
.admin{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(8,6,14,.88);padding:0 16px}
.acard{width:min(100%,320px);background:#1b1626;border:1px solid var(--edge);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;color:var(--bone);font-family:var(--text)}
.acard label{font-family:var(--display);font-size:1.3rem}
.acard input{font:inherit;font-size:18px;padding:8px 10px;border-radius:8px;border:1px solid var(--edge);background:var(--ink);color:var(--bone)}
.arow{display:flex;gap:8px;justify-content:flex-end}
.arow button{font-family:var(--display);font-size:16px;min-height:44px;padding:6px 16px;border-radius:999px;border:1px solid var(--candle);background:transparent;color:var(--bone);cursor:pointer}
.acard p{margin:0;min-height:1.2em;font-size:15px;color:#ff9a8a;font-style:italic}
@media (prefers-reduced-motion:reduce){
  .cell{transition:none}
  .cell.boom,.cell.pop,.final.on,.final.on .coord,.cell.dance svg{animation:none}
  .walker .bob,.walker.munch svg,.cell.eaten,.candy svg{animation:none}
}
</style>

<header class="head">
  <h1>Ghostsweeper</h1>
  <div class="count" role="status" aria-label="Ghosts left to find">
    <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#g-ghost"/></svg><span id="left">8</span>
  </div>
  <p class="house" id="house">House I of III</p>
</header>

<main class="stage">
  <div class="frame"><div class="board" id="board" role="grid" aria-label="Haunted house"></div></div>
  <div class="msg" id="msg">
    <p class="msg-t" id="msgT" hidden></p>
    <section class="final" id="final" hidden aria-live="polite">
      <p class="coord coord-n" id="cN"></p>
      <p class="coord coord-w" id="cW"></p>
      <button class="btn primary" id="replay" type="button" style="margin-top:.7rem" hidden>↺ Replay</button>
    </section>
  </div>
</main>

//CODEC-START
function fnv(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function stream(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)&255;};}
function unlock(b64,phrase){const raw=atob(b64);const next=stream(fnv(phrase));const out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i)^next();return new TextDecoder().decode(out);}
//CODEC-END
const PAYLOAD='EFd36Klro40OQi17D9Pul4Egwz+Mj+YU+uz/',PHRASE='ghostsweeper|8';

// three haunted houses, each bigger and busier than the last; the coordinates appear after the third
const LEVELS=[{w:6,g:5},{w:8,g:8},{w:9,g:12}];
const ROMAN=['I','II','III'];
let lvl=0,W=6,H=6,N=36,GHOSTS=5;

// replay always starts again from the first, smallest house
$('#replay').addEventListener('click',function(){setLevel(0);window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});});
// admin door: three quick taps on the title ask for the password; the right one clears the last house and plays the ending
const ADMIN=217580182;let titleTaps=[];
function adminHash(t){let h=2166136261;t="jar-admin|"+t;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
$('h1').addEventListener('pointerdown',function(){const now=performance.now();titleTaps=titleTaps.filter(function(t){return now-t<1500;});titleTaps.push(now);
  if(titleTaps.length>=3){titleTaps=[];$('#aerr').textContent='';$('#apw').value='';$('#admin').hidden=false;setTimeout(function(){$('#apw').focus();},0);}});
function adminClose(){$('#admin').hidden=true;}
function adminTry(){if(adminHash($('#apw').value)!==ADMIN){$('#aerr').textContent="That's not it.";$('#apw').select();return;}
  adminClose();
  const box=$('#scare');box.hidden=true;[$('#flyer'),$('#dark')].forEach(function(el){el.getAnimations().forEach(function(x){x.cancel();});});
  board.classList.remove('fade');setLevel(LEVELS.length-1);
  started=true;place(Math.floor(N/2));
  for(let i=0;i<N;i++)if(!mine[i]){state[i]=1;paint(i);}
  opened=N-GHOSTS;setTimeout(win,400);}
$('#aok').addEventListener('click',adminTry);$('#acancel').addEventListener('click',adminClose);
$('#apw').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();adminTry();}else if(e.key==='Escape')adminClose();});
window.__gs={get level(){return lvl;},solve:function(){if(!started){started=true;place(0);}for(let i=0;i<N;i++)if(!mine[i]&&state[i]!==1){state[i]=1;opened++;paint(i);}win();}};

setLevel(0);
})();
</script>

</body></html>
